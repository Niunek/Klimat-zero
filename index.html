<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Climate: Zero</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <div class="logo">
        🌍 Climate: Zero
    </div>

    <div class="city-name">
        🏙️ Moje miasto
    </div>

</header>

<main>

    <section class="city-panel">

        <h1>🏙️ Moje miasto</h1>

        <p>Witaj w swoim mieście!</p>


        <!-- WIDOK MIASTA -->

        <div class="city-view">

            <div class="building">🏢</div>

            <div class="building factory" id="factory-1">
                🏭
            </div>

            <div class="building">🏠</div>

            <div class="building">🏢</div>

            <div class="building">🏭</div>

            <div class="tree">🌳</div>

            <div class="tree">🌳</div>

            <div class="tree">🌳</div>

            <div class="car">🚗</div>

            <div class="car">🚙</div>

        </div>


        <!-- INFORMACJE O OBIEKCIE -->

        <div id="info-panel" class="info-panel">

            <h2>🏭 Fabryka</h2>

            <p>
                Kliknij obiekt w mieście,
                aby zobaczyć informacje.
            </p>

        </div>


        <!-- STATYSTYKI -->

        <div class="city-stats">

            <div>
                🌫️ Poziom CO₂
                <strong id="co2">75%</strong>
            </div>

            <div>
                🌱 Czystość
                <strong id="cleanliness">40%</strong>
            </div>

            <div>
                🏭 Fabryki
                <strong id="factories">12</strong>
            </div>

            <div>
                💰 Budżet
                <strong id="budget">1000 $</strong>
            </div>

        </div>


        <!-- PASEK ZANIECZYSZCZENIA -->

        <div class="pollution-bar-container">

            <div class="pollution-info">

                <span>🌫️ Zanieczyszczenie</span>

                <strong id="pollution-value">
                    75%
                </strong>

            </div>

            <div class="pollution-bar">

                <div id="pollution-fill"></div>

            </div>

        </div>


        <!-- STARY PRZYCISK TESTOWY -->

        <button id="reduce-emission">
            🌱 Zmniejsz emisję
        </button>


        <!-- TESTOWY RESET BUDŻETU -->

        <button id="reset-budget">
            🛠️ TEST — Przywróć 1000 $
        </button>

    </section>

</main>


<script src="script.js"></script>

</body>
</html>
