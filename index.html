<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Climate: Zero</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<header>

    <div class="logo">
        🌍 Climate: Zero
    </div>

    <div class="city-name">
        🏙️ Moje miasto
    </div>

</header>


<main>

<section class="city-panel">

    <h1>
        🏙️ Moje miasto
    </h1>

    <p>
        Zarządzaj miastem i zmniejszaj jego wpływ na klimat.
    </p>


    <!-- ========================= -->
    <!-- MIASTO -->
    <!-- ========================= -->

    <div class="city-view">


        <!-- BIUROWIEC 1 -->

        <div
            class="building"
            data-type="office"
            data-id="office-1"
        >
            🏢
        </div>


        <!-- FABRYKA CHEMICZNA -->

        <div
            class="building factory"
            data-type="chemical-factory"
            data-id="factory-1"
        >
            🏭
        </div>


        <!-- DOM -->

        <div
            class="building"
            data-type="house"
            data-id="house-1"
        >
            🏠
        </div>


        <!-- BIUROWIEC 2 -->

        <div
            class="building"
            data-type="office"
            data-id="office-2"
        >
            🏢
        </div>


        <!-- FABRYKA PRZEMYSŁOWA -->

        <div
            class="building factory"
            data-type="industrial-factory"
            data-id="factory-2"
        >
            🏭
        </div>


        <!-- PARK 1 -->

        <div
            class="tree"
            data-type="park"
            data-id="park-1"
        >
            🌳
        </div>


        <!-- PARK 2 -->

        <div
            class="tree"
            data-type="park"
            data-id="park-2"
        >
            🌳
        </div>


        <!-- PARK 3 -->

        <div
            class="tree"
            data-type="park"
            data-id="park-3"
        >
            🌳
        </div>


        <!-- SAMOCHÓD 1 -->

        <div
            class="car"
            data-type="car"
            data-id="car-1"
        >
            🚗
        </div>


        <!-- SAMOCHÓD 2 -->

        <div
            class="car"
            data-type="car"
            data-id="car-2"
        >
            🚙
        </div>


        <!-- NOWE: ELEKTROWNIA -->

        <div
            class="building power-plant"
            data-type="power-plant"
            data-id="power-plant-1"
        >
            ⚡
        </div>


        <!-- NOWE: RECYKLING -->

        <div
            class="building recycling"
            data-type="recycling"
            data-id="recycling-1"
        >
            ♻️
        </div>


        <!-- NOWE: ZAJEZDNIA -->

        <div
            class="building bus-depot"
            data-type="bus"
            data-id="bus-1"
        >
            🚌
        </div>


        <!-- NOWE: SZPITAL -->

        <div
            class="building hospital"
            data-type="hospital"
            data-id="hospital-1"
        >
            🏥
        </div>

    </div>


    <!-- ========================= -->
    <!-- PANEL INFORMACJI -->
    <!-- ========================= -->

    <div
        id="info-panel"
        class="info-panel"
    >

        <h2>
            🏙️ Miasto
        </h2>

        <p>
            Kliknij obiekt, aby zobaczyć informacje.
        </p>

    </div>


    <!-- ========================= -->
    <!-- STATYSTYKI -->
    <!-- ========================= -->

    <div class="city-stats">


        <div>

            🌫️ Poziom CO₂

            <strong id="co2">
                75%
            </strong>

        </div>


        <div>

            🌱 Czystość

            <strong id="cleanliness">
                40%
            </strong>

        </div>


        <div>

            😊 Zadowolenie

            <strong id="satisfaction">
                60%
            </strong>

        </div>


        <div>

            🏭 Fabryki

            <strong id="factories">
                2
            </strong>

        </div>


        <div>

            💰 Budżet

            <strong id="budget">
                1000 $
            </strong>

        </div>


        <div>

            📅 Tura

            <strong id="turn">
                1
            </strong>

        </div>

    </div>


    <!-- ========================= -->
    <!-- PASEK CO2 -->
    <!-- ========================= -->

    <div class="pollution-bar-container">

        <div class="pollution-info">

            <span>
                🌫️ Zanieczyszczenie
            </span>

            <strong id="pollution-value">
                75%
            </strong>

        </div>


        <div class="pollution-bar">

            <div
                id="pollution-fill"
            ></div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- PRZYCISKI -->
    <!-- ========================= -->

    <div class="main-buttons">

        <button
            id="reset-budget"
        >
            🛠️ TEST — Resetuj grę
        </button>


        <button
            id="end-turn"
        >
            ⏭️ Zakończ turę
        </button>

    </div>

</section>

</main>


<script src="script.js"></script>

</body>

</html>
